name: Python CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checking out code and Gitleaks/Semgrep
      security-events: write # For Semgrep to upload SARIF results to GitHub Security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to scan full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a specific version like '3.9' or '3.10' as needed
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation."
          fi
        continue-on-error: true # Allow subsequent steps to run even if dependency installation fails

      - name: Run tests with Pytest
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            # Ensure pytest is installed if not in requirements.txt (e.g., for projects without test dependencies specified)
            if ! command -v pytest &> /dev/null; then
              echo "pytest not found, installing..."
              pip install pytest
            fi
            pytest
          else
            echo "No Python test files (test_*.py or *_test.py) found, skipping Pytest."
          fi
        continue-on-error: true # Allow security scans to run even if tests fail or are skipped

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Allow subsequent steps to run even if secrets are found

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          # Recommend using SEMGREP_APP_TOKEN for publishing to Semgrep App
          # If not set, Semgrep will run locally and upload results to GitHub Security via SARIF
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN || secrets.SEMGREP_TOKEN }}
        continue-on-error: true # Allow subsequent steps to run even if vulnerabilities are found
